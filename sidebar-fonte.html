<script>
// ───────────────────────────────────────────────────────────────────────────
//  Ações do repositório distribuídas entre as duas colunas:
//
//    esquerda, no pé da lista de capítulos → "Ver o código fonte"
//                                            (encurtado para a raiz do repo)
//    direita, ao fim de "Nesta seção"      → as demais ações (issue, edit…)
//
//  Também: remove do cabeçalho o ícone duplicado gerado por repo-url,
//  dá ícone às ações que o Quarto deixa sem, abre os links externos em nova
//  aba e preserva a cópia do rodapé que serve às telas estreitas.
// ───────────────────────────────────────────────────────────────────────────
(function () {

  var ABRIR_EM_NOVA_ABA = true;   // false para navegar na mesma aba

  function externo(a) {
    return a.protocol && /^https?:$/.test(a.protocol) &&
           a.hostname && a.hostname !== window.location.hostname;
  }
  function novaAba(a) {
    if (!ABRIR_EM_NOVA_ABA || !a || !externo(a)) return;
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener');
  }

  function ajustar() {
    var barra  = document.getElementById('quarto-sidebar');
    var margem = document.getElementById('quarto-margin-sidebar');
    var blocos = Array.prototype.slice.call(document.querySelectorAll('.toc-actions'));
    if (!barra || !blocos.length) return;

    // ── 1. encurta o link do código fonte em TODAS as cópias e tira o
    //       ícone duplicado do cabeçalho ─────────────────────────────────
    var base = null;
    blocos.forEach(function (bloco) {
      var f = bloco.querySelector('a[href*="/blob/"]');
      if (!f) return;
      base = base || f.getAttribute('href').split('/blob/')[0];
      f.setAttribute('href', base);
    });
    if (base) {
      var icone = document.querySelector(
        '.sidebar-tools-main a.quarto-navigation-tool[href="' + base + '"]'
      );
      if (icone) icone.remove();
    }

    // ── 2. o Quarto só decora a primeira ação; copia o ícone para as demais
    var modelo = document.querySelector('.toc-actions i.bi:not(.empty)');
    var classe = 'bi-github';
    if (modelo) {
      Array.prototype.forEach.call(modelo.classList, function (c) {
        if (c !== 'bi') classe = c;
      });
    }
    Array.prototype.forEach.call(
      document.querySelectorAll('.toc-actions i.bi.empty'),
      function (i) { i.classList.remove('empty'); i.classList.add(classe); }
    );

    // ── 3. define qual bloco é o da coluna da direita ────────────────────
    var principal = null;
    blocos.forEach(function (b) { if (margem && margem.contains(b)) principal = b; });

    if (!principal && margem) {
      // Capítulos sem subtítulos não têm sumário: o Quarto põe o bloco só no
      // rodapé. Clonamos para a margem e deixamos o original no rodapé,
      // restrito às telas estreitas — que é como o Quarto faz nas demais
      // páginas. Mover em vez de clonar sumiria com as ações no celular.
      var origem = blocos[0];
      principal = origem.cloneNode(true);
      principal.classList.add('toc-actions-soltas');
      origem.classList.add('d-sm-block', 'd-md-none');

      // a margem vazia vem com "zindex-bottom" (z-index: -1): o conteúdo
      // ficaria visível, porém atrás do contêiner da página e sem receber
      // clique. A classe sai junto.
      margem.classList.remove('zindex-bottom');
      margem.appendChild(principal);
    }

    // ── 4. move o item do código fonte para o pé da barra esquerda ───────
    if (principal) {
      var fonte = principal.querySelector('a[href$="' + (base || '###') + '"]');
      if (fonte) {
        var caixa = document.createElement('div');
        caixa.className = 'toc-actions';
        var lista = document.createElement('ul');
        lista.appendChild(fonte.closest('li'));
        caixa.appendChild(lista);

        var rodape = document.createElement('div');
        rodape.className = 'sidebar-fonte';
        rodape.appendChild(document.createElement('hr'));
        rodape.appendChild(caixa);
        barra.appendChild(rodape);
      }
      if (!principal.querySelectorAll('li').length) principal.remove();
    }

    Array.prototype.forEach.call(
      document.querySelectorAll('.sidebar-tools-main a, .toc-actions a, .nav-footer a'),
      novaAba
    );
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ajustar);
  } else { ajustar(); }
})();
</script>
